<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据查看器</title>
<script src="/static/echarts.min.js"></script>
<script src="/static/js/dayjs.min.js"></script>
<script src="/static/js/time-series-sampling.js"></script>
<script src="/static/js/dayjs-utc.min.js"></script>
<script>dayjs.extend(dayjs_plugin_utc);</script>
<style>
:root {
  --bg: #f5f7fa; --card: #fff; --border: #e5e7eb;
  --primary: #1677ff; --text: #1f2937; --text2: #6b7280;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; display:flex; flex-direction:column; overflow:hidden; }

/* 顶栏 */
.topbar { background:#fff; border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.topbar h1 { font-size:16px; font-weight:600; }
.topbar .file-title { font-size:15px; font-weight:600; color:var(--text); flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar .file-info { font-size:12px; color:var(--text2); text-align:right; line-height:1.4; }
.btn { padding:7px 16px; border:1px solid var(--primary); background:var(--primary); color:#fff; border-radius:6px; font-size:13px; cursor:pointer; }
.btn:hover { background:#3c8dff; }
.btn.ghost { background:#fff; color:var(--primary); }
.btn.ghost:hover { background:#f0f7ff; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

/* 主区 */
.main { flex:1; display:flex; min-height:0; }
.chart-panel { flex:1; display:flex; flex-direction:column; min-width:0; background:#fff; }
#chart { flex:1; min-height:0; }

/* 右侧列选择 */
.sidebar { width:280px; border-left:1px solid var(--border); background:#fff; display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .head { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.sidebar .head b { font-size:13px; }
.sidebar .head .count { font-size:11px; color:var(--text2); margin-left:auto; }
.sidebar .tools { padding:8px 14px; display:flex; gap:8px; border-bottom:1px solid var(--border); }
.sidebar .tools a { font-size:12px; color:var(--primary); cursor:pointer; text-decoration:none; }
.sidebar .tools a:hover { text-decoration:underline; }
#cols { flex:1; overflow-y:auto; padding:6px 0; }
.col-item { display:flex; align-items:center; gap:8px; padding:4px 14px; cursor:pointer; user-select:none; }
.col-item:hover { background:#f5f8ff; }
.col-item input[type=checkbox] { accent-color: var(--primary); cursor:pointer; flex-shrink:0; }
.col-item .name { font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.col-item .name input { width:100%; font-size:13px; border:1px solid var(--primary); border-radius:4px; padding:2px 4px; outline:none; }
.col-item .unit { font-size:11px; color:var(--text2); flex-shrink:0; }
.col-item .rename-btn { font-size:11px; color:var(--text2); cursor:pointer; flex-shrink:0; padding:2px 4px; border-radius:3px; visibility:hidden; }
.col-item:hover .rename-btn { visibility:visible; }
.col-item .rename-btn:hover { color:var(--primary); background:#eef4ff; }
.col-item .angle-btn { font-size:13px; color:#c0c4cc; cursor:pointer; flex-shrink:0; padding:1px 5px; border-radius:3px; visibility:hidden; font-family:serif; }
.col-item:hover .angle-btn { visibility:visible; }
.col-item .angle-btn.on { color:#722ed1; visibility:visible; font-weight:bold; }
.col-item .angle-btn:hover { color:#722ed1; background:#f4efff; }
.col-item.locked { color:var(--text2); cursor:default; }
.col-item.locked:hover { background:none; }

/* 左侧历史文件抽屉 */
.history-drawer { position:fixed; left:0; top:50%; width:min(320px, calc(100vw - 40px)); height:min(560px, calc(100dvh - 100px)); z-index:50; transform:translate(-100%, -50%); transition:transform .18s ease; pointer-events:none; }
.history-drawer.open { transform:translate(0, -50%); }
.history-trigger { position:absolute; left:100%; top:50%; transform:translateY(-50%); width:26px; height:64px; display:flex; align-items:center; justify-content:center; background:var(--card); color:var(--primary); border:1px solid var(--border); border-left:0; border-radius:0 8px 8px 0; box-shadow:3px 2px 10px #1f293714; cursor:pointer; pointer-events:auto; }
.history-trigger svg { width:18px; height:18px; transition:transform .18s ease; }
.history-drawer.open .history-trigger svg { transform:rotate(180deg); }
.history-trigger:hover { background:#f0f7ff; }
.history-trigger:focus-visible, .history-item:focus-visible, .history-retry:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
.history-panel { height:100%; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-left:0; border-radius:0 12px 12px 0; box-shadow:6px 4px 24px #1f29371a; visibility:hidden; transition:visibility .18s; }
.history-drawer.open .history-panel { visibility:visible; pointer-events:auto; }
.history-head { display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--border); }
.history-head h2 { font-size:14px; font-weight:600; }
.history-count { font-size:12px; color:var(--text2); }
.history-list { flex:1; min-height:0; overflow-y:auto; padding:8px; overscroll-behavior:contain; }
.history-item { display:block; width:100%; padding:11px 12px; margin-bottom:4px; text-align:left; font:inherit; color:var(--text); border:1px solid transparent; border-radius:7px; background:transparent; cursor:pointer; }
.history-item:hover { background:#f5f8ff; }
.history-item.active { background:#eef5ff; border-color:#c7ddff; }
.history-file { display:flex; align-items:center; gap:8px; }
.history-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:500; }
.history-current { flex-shrink:0; color:var(--primary); font-size:11px; }
.history-meta { display:block; margin-top:5px; color:var(--text2); font-size:11px; line-height:1.6; }
.history-message { padding:28px 12px; text-align:center; color:var(--text2); font-size:13px; line-height:1.8; }
.history-retry { display:block; margin:12px auto 0; padding:4px 12px; color:var(--primary); background:var(--card); border:1px solid var(--border); border-radius:5px; cursor:pointer; }
@media (prefers-reduced-motion: reduce) { .history-drawer, .history-trigger svg, .history-panel { transition:none; } }

/* 空状态 */
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--text2); }
.empty .icon { font-size:48px; opacity:.4; }
.empty .tip { font-size:13px; line-height:1.8; text-align:center; }

/* 加载遮罩（居中显示状态 + 服务端实时日志） */
#loading { position:fixed; inset:0; background:rgba(255,255,255,.92); display:none; align-items:center; justify-content:center; z-index:98; font-size:14px; color:var(--text2); flex-direction:column; gap:14px; }
.spinner { width:36px; height:36px; border:3px solid #d9e5ff; border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#loading-text { font-size:15px; color:var(--text); font-weight:500; }
#loading-bar { display:none; width:340px; height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; }
#loading-bar div { height:100%; width:0; background:var(--primary); border-radius:3px; transition:width .2s; }
#loading-logs { display:none; max-width:560px; padding:10px 16px; background:#f8fafc; border:1px solid var(--border); border-radius:8px; font-family:Consolas, monospace; font-size:12px; line-height:1.9; color:var(--text2); max-height:180px; overflow-y:auto; }
#loading-logs .t { color:#9ca3af; margin-right:8px; }
#loading-logs .m { white-space:pre-wrap; }

/* toast */
#toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:6px; font-size:13px; display:none; z-index:99; }
#loading { position:fixed; inset:0; background:rgba(255,255,255,.85); display:none; align-items:center; justify-content:center; z-index:98; font-size:14px; color:var(--text2); flex-direction:column; gap:12px; }
.spinner { width:32px; height:32px; border:3px solid #d9e5ff; border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#loading-bar { display:none; width:320px; height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; }
#loading-bar div { height:100%; width:0; background:var(--primary); border-radius:3px; transition:width .2s; }
</style>
</head>
<body>

<div class="topbar">
  <button class="btn" id="btn-open" onclick="pickFile()">选择数据文件</button>
  <div class="file-title" id="file-title">未加载文件</div>
  <button class="btn ghost" id="btn-export" onclick="exportPNG()" title="导出图片（Ctrl+Shift+E，包含当前悬浮弹窗）" aria-keyshortcuts="Control+Shift+E Meta+Shift+E" disabled>导出图片</button>
  <div class="file-info" id="file-info"></div>
</div>

<div class="main">
  <div class="chart-panel">
    <div id="chart"></div>
  </div>
  <div class="sidebar">
    <div class="head"><b>数据列</b><span class="count" id="col-count"></span></div>
    <div class="tools">
      <a onclick="selectAll(true)">全选</a>
      <a onclick="selectAll(false)">全不选</a>
      <a onclick="resetZoom()">重置缩放</a>
    </div>
    <div id="cols"></div>
  </div>
</div>

<aside class="history-drawer" id="history-drawer" aria-label="历史数据文件">
  <button class="history-trigger" id="history-trigger" type="button" aria-label="历史数据文件" aria-expanded="false" aria-controls="history-panel" title="历史数据文件">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="history-panel" id="history-panel" inert>
    <div class="history-head"><h2>历史数据文件</h2><span class="history-count" id="history-count"></span></div>
    <div class="history-list" id="history-list" aria-live="polite"><div class="history-message">正在读取历史文件...</div></div>
  </div>
</aside>

<div id="toast"></div>
<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">加载中...</div>
  <div id="loading-bar"><div></div></div>
  <div id="loading-logs"></div>
</div>

<script>
"use strict";

const PALETTE = ["#1677ff","#52c41a","#fa8c16","#f5222d","#722ed1","#13c2c2","#eb2f96","#a0d911","#faad14","#ff7a45","#9254de","#597ef7","#36cfc9","#ff85c0","#95de64","#ffc53d"];
let chart;
let DATA = null;          // {t:[], cols:{name:{v:[],unit,desc}}, tCol, file}
let selected = new Set(); // 已选列名
let FILE_HASH = null;     // 当前文件 SHA-256
let colNames = {};        // 列名重命名映射 {原始名: 显示名}
let saveTimer = null;     // UI 状态防抖保存
let logCursor = -1;       // 日志轮询游标
const formatterCache = { _key: null, _order: [] };  // tooltip 排序缓存
let logPolling = false;   // 防止轮询堆积
let loadGen = 0;           // 加载代际（防止会话恢复与手动上传竞争）

function toast(msg, ms=2500) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms);
}
function showLoading(on, text, pct) {
  const el = document.getElementById("loading");
  el.style.display = on ? "flex" : "none";
  if (text != null) document.getElementById("loading-text").textContent = text;
  const bar = document.getElementById("loading-bar");
  if (pct != null && pct >= 0) {
    bar.style.display = "block";
    bar.firstElementChild.style.width = pct + "%";
  } else {
    bar.style.display = "none";
  }
  if (!on) {
    // 关闭时清空日志区
    document.getElementById("loading-logs").style.display = "none";
    document.getElementById("loading-logs").innerHTML = "";
  }
}
function fmtT(ms) { return dayjs(ms).utc().format("MM-DD HH:mm"); }
function fmtTFull(ms) { return dayjs(ms).utc().format("YYYY-MM-DD HH:mm:ss"); }

// ---------- 历史数据文件 ----------
let historyItems = [];
let historyRequest = null;
let historyUpdatedAt = 0;
const historyDrawer = document.getElementById("history-drawer");
const historyTrigger = document.getElementById("history-trigger");

function setHistoryOpen(open) {
  historyDrawer.classList.toggle("open", open);
  historyTrigger.setAttribute("aria-expanded", String(open));
  document.getElementById("history-panel").inert = !open;
  if (open) refreshHistory();
}
historyDrawer.addEventListener("pointerenter", () => setHistoryOpen(true));
historyDrawer.addEventListener("pointerleave", () => setHistoryOpen(false));
historyDrawer.addEventListener("focusin", () => setHistoryOpen(true));
historyDrawer.addEventListener("focusout", e => {
  if (!historyDrawer.contains(e.relatedTarget) && !historyDrawer.matches(":hover")) setHistoryOpen(false);
});
historyTrigger.addEventListener("click", () => setHistoryOpen(true));
historyDrawer.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    historyTrigger.focus();
    setHistoryOpen(false);
    e.preventDefault();
  }
});

function renderHistory() {
  const box = document.getElementById("history-list");
  box.replaceChildren();
  document.getElementById("history-count").textContent = `${historyItems.length} 个文件`;
  if (!historyItems.length) {
    box.innerHTML = '<div class="history-message">暂无历史数据文件<br>打开数据文件后会自动保留在这里</div>';
    return;
  }
  for (const item of historyItems) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "history-item" + (item.hash === FILE_HASH ? " active" : "");
    if (item.hash === FILE_HASH) button.setAttribute("aria-current", "true");
    const filename = item.file || "未命名文件";
    button.title = filename;
    button.innerHTML = `<span class="history-file"><span class="history-name">${esc(filename)}</span>${item.hash === FILE_HASH ? '<span class="history-current">当前</span>' : ''}</span>
      <span class="history-meta">${Number(item.rows || 0).toLocaleString()} 行 · ${Number(item.cols || 0).toLocaleString()} 列<br>${esc(item.mtime || '')}</span>`;
    button.addEventListener("click", () => openHistoryFile(item));
    box.appendChild(button);
  }
}

async function refreshHistory(force = false) {
  if (historyRequest) return historyRequest;
  if (!force && Date.now() - historyUpdatedAt < 30000) return;
  historyRequest = (async () => {
    try {
      const r = await fetch("/api/cache", { cache: "no-store" });
      if (!r.ok) throw new Error("读取历史文件失败");
      const result = await r.json();
      historyItems = result.items || [];
      historyUpdatedAt = Date.now();
      renderHistory();
    } catch (e) {
      const box = document.getElementById("history-list");
      box.innerHTML = '<div class="history-message">历史文件暂时无法读取<button class="history-retry" type="button">重试</button></div>';
      box.querySelector("button").addEventListener("click", () => refreshHistory(true));
    }
  })();
  try { await historyRequest; } finally { historyRequest = null; }
}

function beginFileLoad() {
  const gen = ++loadGen;
  clearTimeout(saveTimer);
  doSaveUIState(); // 切换前保存当前文件，避免防抖任务写到新文件
  setHistoryOpen(false);
  return gen;
}

async function openCachedFile(hash) {
  const r = await fetch("/api/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hash }),
  });
  if (!r.ok) {
    const error = await r.json().catch(() => ({}));
    throw new Error(error.detail || `服务端错误 ${r.status}`);
  }
  return r.json();
}

async function openHistoryFile(item) {
  if (item.hash === FILE_HASH && DATA) { setHistoryOpen(false); return; }
  const gen = beginFileLoad();
  try {
    showLoading(true, `正在加载历史数据: ${item.file || '未命名文件'}`);
    const data = await openCachedFile(item.hash);
    if (gen !== loadGen) return;
    DATA = data;
    FILE_HASH = item.hash;
    await loadUIState();
    if (gen !== loadGen) return;
    afterLoad();
  } catch (e) {
    if (gen !== loadGen) return;
    toast("加载失败: " + e.message, 4000);
    refreshHistory(true);
  } finally {
    if (gen === loadGen) showLoading(false);
  }
}

// ---------- 文件选择 ----------
function pickFile() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".xlsx,.xls,.csv";
  inp.onchange = () => { if (inp.files[0]) loadFile(inp.files[0]); };
  inp.click();
}

async function loadFile(file) {
  const gen = beginFileLoad();   // 本次加载的代际
  const totalMB = (file.size / 1024 / 1024).toFixed(1);
  try {
    // --- 0. 算文件 SHA-256，查缓存 ---
    showLoading(true, "计算文件特征值...");
    const buf = await file.arrayBuffer();
    const digest = await crypto.subtle.digest("SHA-256", buf);
    const hash = [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
    if (gen !== loadGen) return;
    let data = null;
    try {
      data = await openCachedFile(hash);
      if (gen !== loadGen) return;
      toast("已从缓存加载（免上传免解析）");
    } catch (e) { /* 缓存查询失败则正常上传 */ }

    if (gen !== loadGen) return;
    if (!data) {
      // --- 1. 上传（XHR 带进度）---
      showLoading(true, `正在上传 ${file.name} (${totalMB} MB)...`, 0);
      data = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const fd = new FormData();
        fd.append("file", new File([buf], file.name));
        xhr.open("POST", "/api/upload2");
        xhr.responseType = "json";
        xhr.upload.onprogress = e => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            showLoading(true, `正在上传 ${file.name} (${totalMB} MB)... ${pct}%`, pct);
          }
        };
        xhr.upload.onload = () => showLoading(true, "服务端解析中（读取 Excel → 识别表头/时间列 → 提取数值列）...", 100);
        xhr.onload = () => {
          if (gen !== loadGen) { reject(new Error("已取消")); return; }
          if (xhr.status === 200) resolve(xhr.response);
          else reject(new Error(xhr.response?.detail || `服务端错误 ${xhr.status}`));
        };
        xhr.onerror = () => reject(new Error("网络错误"));
        xhr.send(fd);
      });
    }
    if (gen !== loadGen) return;
    showLoading(true, "正在绘制曲线...");
    DATA = data;
    FILE_HASH = hash;
    await loadUIState();   // 恢复列名/选中列/缩放状态
    if (gen !== loadGen) return;
    afterLoad();
    refreshHistory(true);
  } catch (e) {
    if (gen === loadGen) toast("加载失败: " + e.message, 4000);
  } finally {
    if (gen === loadGen) showLoading(false);
  }
}

// ---------- UI 状态持久化（列名/选中列/缩放） ----------
async function loadUIState() {
  colNames = {};
  selected = new Set();
  angleOverride = {};
  window.__restoreZoom = [0, 100];
  // 读取列含义缓存中的角度标记（用户手动指定，优先于自动规则）
  try {
    const r = await fetch("/api/colmeta", { cache: "no-store" });
    if (r.ok) {
      const meta = await r.json();
      for (const [col, m] of Object.entries(meta)) {
        if (m && m.angle !== undefined) angleOverride[col] = !!m.angle;
      }
    }
  } catch (e) {}
  if (!FILE_HASH) return;
  try {
    const r = await fetch(`/api/uistate/${FILE_HASH}`);
    if (r.ok) {
      const st = await r.json();
      colNames = st.colNames || {};
      const names = Object.keys(DATA.cols);
      if (st.selected && st.selected.length) {
        selected = new Set(st.selected.filter(n => names.includes(n)));
      }
      if (st.zoom && st.zoom.length === 2) window.__restoreZoom = st.zoom;
    }
  } catch (e) { /* 无状态则用默认 */ }
}

function saveUIState() {
  if (!FILE_HASH || !DATA) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSaveUIState, 600);
}

async function doSaveUIState(useBeacon) {
  if (!FILE_HASH || !DATA) return;
  let zoom = null;
  try {
    const o = chart.getOption();
    const dz = o.dataZoom && o.dataZoom[1];
    if (dz && dz.start != null) zoom = [dz.start, dz.end];
  } catch (e) {}
  const payload = JSON.stringify({
    file: DATA.file,
    colNames,
    selected: [...selected],
    zoom,
  });
  try {
    if (useBeacon) {
      // 页面关闭场景：sendBeacon 不保证 Content-Type 为 json，后端兼容 text/plain
      navigator.sendBeacon(`/api/uistate/${FILE_HASH}?beacon=1`, new Blob([payload], { type: "text/plain" }));
    } else {
      await fetch(`/api/uistate/${FILE_HASH}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
    }
  } catch (e) { /* 保存失败静默 */ }
}

// 页面关闭前立即保存（防抖未触发时不丢状态）
window.addEventListener("beforeunload", () => {
  if (saveTimer) doSaveUIState(true);
});

function afterLoad() {
  renderHistory();
  const names = Object.keys(DATA.cols);
  // 默认不选任何列；有保存状态则已恢复
  if (!selected.size) selected = new Set();
  renderSidebar();
  document.getElementById("file-title").textContent = DATA.file;
  document.getElementById("file-info").innerHTML =
    `${DATA.rows.toLocaleString()} 行 · ${names.length} 列 · 时间列: ${DATA.tCol}`;
  document.getElementById("btn-export").disabled = false;
  renderChart();
}

// ---------- 侧栏 ----------
function displayName(n) { return colNames[n] || n; }

function renderSidebar() {
  const box = document.getElementById("cols");
  const names = Object.keys(DATA.cols);
  document.getElementById("col-count").textContent = `${selected.size}/${names.length}`;
  box.innerHTML = names.map(n => {
    const c = DATA.cols[n];
    const on = selected.has(n);
    const angle = isAngleCol(n);
    return `<label class="col-item">
      <input type="checkbox" ${on ? "checked" : ""} onchange="toggleCol('${esc(n)}', this.checked)">
      <span class="name" title="${esc(n)}${c.desc ? " · " + esc(c.desc) : ""}${angle ? " · 角度列已展开(消除0/360跳变)" : ""}" ondblclick="renameCol('${esc(n)}', this)">${esc(displayName(n))}</span>
      ${angle ? `<span class="unit" style="color:#722ed1" title="角度列已展开：相邻差>180°时±360°修正，消除0/360假跳变">展开</span>` : (c.unit ? `<span class="unit">${esc(c.unit)}</span>` : "")}
      <span class="angle-btn${angle ? " on" : ""}" title="标记/取消角度列（角度列自动展开并挂副轴）" onclick="event.preventDefault();event.stopPropagation();toggleAngleMark('${esc(n)}')">${angle ? "∠" : "∠"}</span>
      <span class="rename-btn" onclick="renameCol('${esc(n)}', this.parentElement.querySelector('.name'))">改名</span>
    </label>`;
  }).join("");
}

function renameCol(n, el) {
  if (!el) return;
  const orig = displayName(n);
  el.innerHTML = `<input type="text" value="${esc(orig)}">`;
  const inp = el.querySelector("input");
  inp.focus();
  inp.select();
  const commit = () => {
    const v = inp.value.trim();
    if (v && v !== n) colNames[n] = v;
    else delete colNames[n];
    renderSidebar();
    renderChart();
    saveUIState();
  };
  inp.onblur = commit;
  inp.onkeydown = e => {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { inp.onblur = null; renderSidebar(); }
  };
  inp.onclick = e => e.stopPropagation();
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;").replace(/"/g,"&quot;"); }
function toggleCol(name, on) {
  if (on) selected.add(name); else selected.delete(name);
  renderChart();
  document.getElementById("col-count").textContent = `${selected.size}/${Object.keys(DATA.cols).length}`;
  saveUIState();
}
function selectAll(on) {
  const names = Object.keys(DATA.cols);
  selected = on ? new Set(names) : new Set();
  renderSidebar(); renderChart();
  saveUIState();
}
function resetZoom() {
  if (chart) chart.dispatchAction({ type: "dataZoom", start: 0, end: 100 });
}

// ---------- 主图（K线式缩放：底部滑块可拖动/边缘缩放，主图滚轮缩放） ----------
// ---------- 角度列展开（unwrapping） ----------
// 0°与360°在方向上相邻，直接画线会出现大幅假跳变；展开为连续序列消除跳变
const ANGLE_PAT = /(AWA|TWA|TWD|WDIR|DIR|HEADING|HDG|COG|COURSE|BEARING|风向|风向角|方位|航向|罗经)/i;

// 角度标记：用户手动指定（存 colmeta.json 的 angle 字段），优先于自动规则
let angleOverride = {};   // {列名: true/false}

function isAngleCol(name) {
  if (angleOverride[name] !== undefined) return angleOverride[name];
  const c = DATA.cols[name];
  if (!c) return false;
  if (ANGLE_PAT.test(name)) return true;
  const u = (c.unit || "").toLowerCase();
  return u === "°" || u === "deg" || u === "degree" || u === "度";
}

async function toggleAngleMark(name) {
  const c = DATA.cols[name];
  if (!c) return;
  const cur = isAngleCol(name);
  angleOverride[name] = !cur;
  // 持久化到 colmeta（服务端）
  try {
    const r = await fetch("/api/colmeta", { cache: "no-store" });
    const meta = r.ok ? await r.json() : {};
    if (!meta[name]) meta[name] = { unit: "", desc: "" };
    meta[name].angle = !cur;
    await fetch("/api/colmeta", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(meta),
    });
    toast(!cur ? `${displayName(name)} 已标记为角度列（展开+副轴）` : `${displayName(name)} 已取消角度标记`);
  } catch (e) {
    toast("标记已生效但保存失败: " + e.message);
  }
  // 清展开缓存重算
  if (c._unwrapped) { c._unwrapped = null; }
  renderSidebar();
  renderChart();
  saveUIState();
}

// 展开算法：相邻差 >180° 时 ±360° 修正，返回新数组（缓存避免重复计算）
function unwrapSeries(name) {
  const c = DATA.cols[name];
  if (!c) return null;
  if (!c._unwrapped) {
    const v = c.v;
    const out = new Array(v.length);
    let offset = 0;
    let prev = null;
    for (let i = 0; i < v.length; i++) {
      const x = v[i];
      if (x == null) { out[i] = null; continue; }
      if (prev != null) {
        const d = x + offset - prev;
        if (d > 180) offset -= 360;
        else if (d < -180) offset += 360;
      }
      out[i] = x + offset;
      prev = out[i];
    }
    c._unwrapped = out;
  }
  return c._unwrapped;
}

// 归一化到 [0,360) 仅用于判断显示（不影响展开值）

// ---------- 随可见范围重新取样 ----------
let chartView = null;
let viewUpdateTimer = null;
function currentChartZoom() {
  const option = chart && chart.getOption();
  const dz = option && option.dataZoom;
  return dz && dz[1] ? [dz[1].start, dz[1].end] : [0, 100];
}
function buildViewSeries(zoom) {
  const { data, series, cache } = chartView;
  const times = data.t;
  const lo = times[0], hi = times[times.length - 1];
  const start = lo + (hi - lo) * zoom[0] / 100;
  const end = lo + (hi - lo) * zoom[1] / 100;
  const width = Math.max(1, chart.getWidth() - 136);
  const key = `${start}:${end}:${width}`;
  let sampled = cache.get(key);
  if (!sampled) {
    sampled = series.map(s => TimeSeriesSampling.sample(times, s.values, start, end, width));
    cache.set(key, sampled);
    if (cache.size > 8) cache.delete(cache.keys().next().value);
  }
  const result = series.map((s, i) => ({
    id: s.id, name: s.name, type: "line", showSymbol: false, connectNulls: false,
    yAxisIndex: s.yAxisIndex, data: sampled[i],
    lineStyle: { width: 1.4 }, itemStyle: { color: s.color },
  }));
  // Independent full-range overview keeps the slider stable while the main series changes.
  const overviewKey = `overview:${width}`;
  if (!cache.has(overviewKey)) {
    cache.set(overviewKey, series.length ? TimeSeriesSampling.sample(times, series[0].values, lo, hi, width) : [[lo, null], [hi, null]]);
  }
  result.push({ id: "overview", name: "", type: "line", xAxisIndex: 1, yAxisIndex: 2,
    data: cache.get(overviewKey), showSymbol: false, silent: true,
    lineStyle: { opacity: 0 }, itemStyle: { opacity: 0 }, tooltip: { show: false } });
  return result;
}
function scheduleViewUpdate() {
  if (viewUpdateTimer != null) return;
  viewUpdateTimer = setTimeout(() => {
    viewUpdateTimer = null;
    if (!chartView || chartView.data !== DATA) return;
    chart.setOption({ series: buildViewSeries(currentChartZoom()) }, { replaceMerge: ["series"], silent: true });
  }, 60);
}

function renderChart() {
  if (!chart) chart = echarts.init(document.getElementById("chart"));
  const t = DATA.t;
  // 先判断是否存在角度列（决定副轴），再构建系列
  const angleCols = [...selected].filter(n => isAngleCol(n));
  const hasAngle = angleCols.length > 0;
  // 多条角度列对齐：以第一条为基准，其余整体平移 360 的倍数，使中位数最接近基准
  // （否则一条在 0° 附近、另一条在 360° 附近，物理同向却相距一圈）
  let baseMed = null;
  const angleShift = {};
  if (angleCols.length > 1) {
    const med = a => {
      const vs = a.filter(v => v != null).sort((x, y) => x - y);
      if (!vs.length) return null;
      return vs[Math.floor(vs.length / 2)];
    };
    baseMed = med(unwrapSeries(angleCols[0]));
    if (baseMed != null) {
      for (const n of angleCols.slice(1)) {
        const m = med(unwrapSeries(n));
        if (m != null) angleShift[n] = 360 * Math.round((baseMed - m) / 360);
      }
    }
  }
  const visibleSeries = [...selected].map((n, i) => {
    const angle = isAngleCol(n);
    let values = angle ? unwrapSeries(n) : DATA.cols[n].v;
    if (angle && angleShift[n]) values = values.map(v => v == null ? null : v + angleShift[n]);
    return { id: "column:" + n, name: displayName(n) + (angle ? " (展开)" : ""),
      values, yAxisIndex: angle ? 1 : 0, color: PALETTE[i % PALETTE.length] };
  });
  chartView = { data: DATA, series: visibleSeries, cache: new Map() };
  const zoom = window.__restoreZoom || currentChartZoom();
  const series = buildViewSeries(zoom);
  // 保留当前缩放状态（勾选列时不重置）
  let keepZoom = null;
  if (chart.getOption) {
    try {
      const o = chart.getOption();
      const dz = o.dataZoom && o.dataZoom[1];
      if (dz && dz.start != null) keepZoom = [dz.start, dz.end];
    } catch (e) {}
  }
  const opt = {
    animation: false,
    tooltip: {
      trigger: "axis",
      className: "chart-tooltip",
      confine: true,
      // 性能：关词 tooltip 位置过渡动画（默认 0.4s，是跟随延迟的主因）
      transitionDuration: 0,
      // 性能：鼠标移动节流间隔（ms），降低高频重绘
      showDelay: 0,
      hideDelay: 50,
      axisPointer: {
        type: "cross",
        label: { backgroundColor: "#1f2937" },
        // 性能：cross 指针实时联动开销大，改为仅 x 轴吸附 + snap
        snap: true,
        animation: false,
      },
      // 性能：大数据量下限制 tooltip 内容渲染频率
      throttle: 50,
      formatter: ps => {
        // 采样后各系列 x 点集不同，axis 自动匹配会缺系列；
        // 改为自己按 tooltip 时间查 DATA 全量数据（最近邻二分）
        if (!ps || !ps.length) return "";
        const tHover = ps[0].value[0];
        // 二分找最近时间索引
        const T = DATA.t;
        let lo = 0, hi = T.length - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (T[mid] < tHover) lo = mid + 1; else hi = mid;
        }
        let idx = lo;
        if (idx > 0 && Math.abs(T[idx-1] - tHover) < Math.abs(T[idx] - tHover)) idx = idx - 1;
        // 圆标按系列颜色自绘（不依赖 ps——采样后部分点位 ps 会缺系列，导致圆标丢失）
        const selArr = [...selected];
        const rows = [];
        selArr.forEach((n, i) => {
          const angle = isAngleCol(n);
          let v = DATA.cols[n].v[idx];
          // Tooltip reports the original measurement, including raw angle values.
          const name = displayName(n) + (angle ? " (展开)" : "");
          const color = PALETTE[i % PALETTE.length];
          const marker = '<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:' + color + ';"></span>';
          rows.push({ name, v, marker });
        });
        rows.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
        let s = `<b>${fmtTFull(T[idx])}</b><br>`;
        rows.forEach(r => s += `${r.marker} ${esc(r.name)}: <b>${r.v ?? "-"}</b><br>`);
        return s;
      },
    },
    legend: { top: 4, type: "scroll", data: visibleSeries.map(s => s.name), textStyle: { fontSize: 11 } },
    grid: { left: 64, right: hasAngle ? 72 : 24, top: 40, bottom: 78 },
    xAxis: [
      { type: "time", min: t[0], max: t[t.length - 1], axisLabel: { formatter: v => fmtT(v) } },
      { type: "time", min: t[0], max: t[t.length - 1], show: false, axisPointer: { show: false } },
    ],
    yAxis: [
      { type: "value", scale: true },
      // 副轴：角度列专用（展开后的连续值）
      {
        type: "value", show: hasAngle, scale: true, name: "角度°(展开)",
        nameTextStyle: { color: "#722ed1", fontSize: 11 },
        axisLine: { show: true, lineStyle: { color: "#722ed1" } },
        splitLine: { show: false },
        axisLabel: { color: "#722ed1", formatter: v => Math.round(v) + "°" },
      },
      { type: "value", show: false, scale: true },
    ],
    dataZoom: [
      { type: "inside", xAxisIndex: [0, 1], filterMode: "none", throttle: 50, zoomOnMouseWheel: true, moveOnMouseMove: true },
      {
        type: "slider", xAxisIndex: [1, 0], filterMode: "none", throttle: 50, showDataShadow: true, bottom: 14, height: 46,
        borderColor: "#d9d9d9", fillerColor: "rgba(22,119,255,0.14)",
        handleStyle: { color: "#1677ff" }, moveHandleStyle: { color: "#1677ff" },
        dataBackground: { lineStyle: { color: "#b8c8e8", width: 1 }, areaStyle: { color: "rgba(22,119,255,0.08)" } },
        selectedDataBackground: { lineStyle: { color: "#1677ff", width: 1 }, areaStyle: { color: "rgba(22,119,255,0.18)" } },
        labelFormatter: v => fmtT(v),
        brushSelect: false,
      },
    ],
    series,
  };
  // 恢复缩放：优先用 uistate 恢复值，否则保留当前视图
  if (window.__restoreZoom) {
    const [s, e] = window.__restoreZoom;
    opt.dataZoom[0].start = s; opt.dataZoom[0].end = e;
    opt.dataZoom[1].start = s; opt.dataZoom[1].end = e;
    window.__restoreZoom = null;
  } else if (keepZoom) {
    opt.dataZoom[0].start = keepZoom[0]; opt.dataZoom[0].end = keepZoom[1];
    opt.dataZoom[1].start = keepZoom[0]; opt.dataZoom[1].end = keepZoom[1];
  }
  clearTimeout(viewUpdateTimer);
  viewUpdateTimer = null;
  chart.setOption(opt, true);
  // 缩放变化 → 保存状态
  if (!chart._zoomBound) {
    chart._zoomBound = true;
    chart.on("datazoom", () => { scheduleViewUpdate(); saveUIState(); });
    bindSliderTooltip();
  }
}

// ---------- 时间轴滑块悬停显示时间 ----------
function bindSliderTooltip() {
  // 自建 tooltip div（滑块区域鼠标跟随）
  const tip = document.createElement("div");
  tip.id = "slider-time-tooltip";
  tip.style.cssText = "position:fixed;z-index:99;display:none;pointer-events:none;background:#1f2937;color:#fff;padding:4px 10px;border-radius:4px;font-size:12px;font-family:Consolas,monospace;white-space:nowrap;";
  document.body.appendChild(tip);

  chart.getZr().on("mousemove", e => {
    const c = chart;
    const chartEl = document.getElementById("chart");
    const rect = chartEl.getBoundingClientRect();
    // 滑块区域：grid 底部以下（bottom=78 预留）到图表底部
    const grid = c.getModel().getComponent("grid");
    const gRect = grid.coordinateSystem.getRect();
    const gridBottomPx = gRect.y + gRect.height;   // grid 底部（图表内坐标）
    const yIn = e.offsetY;
    const xIn = e.offsetX;
    // 滑块范围：gridBottomPx ~ chartH（含 slider），x 在 grid 内
    const inSlider = yIn > gridBottomPx && yIn < c.getHeight() && xIn >= gRect.x && xIn <= gRect.x + gRect.width;
    if (inSlider) {
      // 滑块展示全程概览，悬浮时间始终按完整时间范围计算。
      const ratio = (xIn - gRect.x) / gRect.width;
      const t = DATA.t[0] + ratio * (DATA.t[DATA.t.length - 1] - DATA.t[0]);
      if (t && isFinite(t)) {
        tip.textContent = fmtTFull(t);
        tip.style.display = "block";
        tip.style.left = (rect.left + xIn + 14) + "px";
        tip.style.top = (rect.top + yIn - 30) + "px";
        return;
      }
    }
    tip.style.display = "none";
  });
  chart.getZr().on("mouseout", () => { tip.style.display = "none"; });
}

// ---------- 服务端日志 → 加载遮罩中央实时显示 ----------
async function pollLogs() {
  if (logPolling) return;   // 上一轮未完成，跳过防堆积
  logPolling = true;
  try {
    const r = await fetch(`/api/logs?after=${logCursor}`, { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (d.items.length) {
        const box = document.getElementById("loading-logs");
        // 仅在加载遮罩显示中才展示
        if (document.getElementById("loading").style.display === "flex") {
          box.style.display = "block";
          box.insertAdjacentHTML("beforeend", d.items.map(l =>
            `<div><span class="t">${l.t}</span><span class="m">${esc(l.m)}</span></div>`
          ).join(""));
          box.scrollTop = box.scrollHeight;
        }
      }
      logCursor = d.next;
    }
  } catch (e) {} finally {
    logPolling = false;
  }
}

// ---------- 会话恢复 ----------
async function tryRestoreSession() {
  try {
    const r = await fetch("/api/session", { cache: "no-store" });
    if (!r.ok) return;
    const s = await r.json();
    if (!s.has) return;
    // 有可恢复会话 → 弹窗提示并恢复
    showLoading(true, `正在恢复上次数据: ${s.file}`, null);
    const r2 = await fetch("/api/session/restore", { cache: "no-store" });
    if (!r2.ok) { if (loadGen === 0) showLoading(false); return; }
    const data = await r2.json();
    if (loadGen !== 0) return;   // 用户已手动加载新文件，放弃恢复（不动遮罩，由 loadFile 管理）
    DATA = data;
    FILE_HASH = s.hash;
    await loadUIState();
    if (loadGen !== 0) return;
    afterLoad();
    showLoading(false);
    toast(`已恢复上次数据: ${s.file}`);
  } catch (e) {
    if (loadGen === 0) showLoading(false);
  }
}

// ---------- 启动 ----------
refreshHistory();
pollLogs();
setInterval(pollLogs, 1000);
tryRestoreSession();

// ---------- 导出 ----------
// HTML tooltip lives outside the chart canvas; paint its visible contents onto the export copy.
function paintVisibleTooltip(context) {
  const tip = document.querySelector("#chart .chart-tooltip");
  if (!tip) return;
  const style = getComputedStyle(tip);
  if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) return;
  const box = tip.getBoundingClientRect();
  if (!box.width || !box.height) return;
  const chartBox = document.getElementById("chart").getBoundingClientRect();
  const x = box.left - chartBox.left, y = box.top - chartBox.top;
  context.save();
  context.fillStyle = style.backgroundColor;
  context.shadowColor = "rgba(0, 0, 0, .2)";
  context.shadowBlur = 10;
  context.shadowOffsetX = 1;
  context.shadowOffsetY = 2;
  context.beginPath();
  context.roundRect(x, y, box.width, box.height, parseFloat(style.borderRadius) || 0);
  context.fill();
  context.shadowColor = "transparent";
  const borderWidth = parseFloat(style.borderWidth) || 0;
  if (borderWidth) {
    context.lineWidth = borderWidth;
    context.strokeStyle = style.borderColor;
    context.stroke();
  }
  // Match the existing HTML marker colors and layout.
  for (const marker of tip.querySelectorAll("span")) {
    if (marker.textContent || !marker.style.backgroundColor) continue;
    const rect = marker.getBoundingClientRect();
    context.fillStyle = getComputedStyle(marker).backgroundColor;
    context.beginPath();
    context.ellipse(rect.left - chartBox.left + rect.width / 2,
      rect.top - chartBox.top + rect.height / 2, rect.width / 2, rect.height / 2, 0, 0, Math.PI * 2);
    context.fill();
  }
  const walker = document.createTreeWalker(tip, NodeFilter.SHOW_TEXT);
  const range = document.createRange();
  context.textBaseline = "top";
  let node;
  while ((node = walker.nextNode())) {
    if (!node.textContent.trim()) continue;
    range.selectNodeContents(node);
    const rect = range.getBoundingClientRect();
    const textStyle = getComputedStyle(node.parentElement);
    context.font = `${textStyle.fontStyle} ${textStyle.fontWeight} ${textStyle.fontSize} ${textStyle.fontFamily}`;
    context.fillStyle = textStyle.color;
    context.fillText(node.textContent, rect.left - chartBox.left, rect.top - chartBox.top);
  }
  context.restore();
}

function exportPNG() {
  if (!chart || !DATA || document.getElementById("btn-export").disabled ||
      document.getElementById("loading").style.display === "flex") return;
  try {
    const pixelRatio = 2;
    const rendered = chart.renderToCanvas({ pixelRatio, backgroundColor: "#fff" });
    const canvas = document.createElement("canvas");
    canvas.width = rendered.width;
    canvas.height = rendered.height;
    const context = canvas.getContext("2d");
    context.drawImage(rendered, 0, 0);
    context.scale(pixelRatio, pixelRatio);
    paintVisibleTooltip(context);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = DATA.file.replace(/\.(xlsx|xls|csv)$/i, "") + "_" + fmtT(Date.now()).replace(/[ :]/g, "") + ".png";
    a.click();
    toast("已导出 PNG");
  } catch (e) {
    toast("导出失败: " + e.message, 4000);
  }
}

window.addEventListener("keydown", e => {
  if (e.repeat || e.isComposing || !(e.ctrlKey || e.metaKey) || !e.shiftKey || e.altKey || e.key.toLowerCase() !== "e") return;
  const target = e.target;
  if (target instanceof Element && (target.isContentEditable || target.closest("input, textarea, select"))) return;
  if (!chart || !DATA || document.getElementById("loading").style.display === "flex") return;
  e.preventDefault();
  exportPNG();
});

window.addEventListener("resize", () => {
  if (chart) { chart.resize(); scheduleViewUpdate(); }
});
